services:
  postgres:
    image: postgres:16-alpine
    container_name: kampi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kampi
      POSTGRES_PASSWORD: kampi_dev
      POSTGRES_DB: kampi
    ports:
      - "5432:5432"
    volumes:
      - kampi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampi -d kampi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kampi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kampi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kampi_postgres_data:
  kampi_redis_data:
