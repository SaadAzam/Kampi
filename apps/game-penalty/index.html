<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kampi Penalty Duel</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b3d2e;
        overflow: hidden;
        touch-action: manipulation;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      /* Screen-reader / e2e mirrors of Phaser HUD — not visible controls */
      #kampi-meta {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="kampi-meta" aria-live="polite">
      <div data-testid="status">Ready</div>
      <div data-testid="role"></div>
      <div data-testid="score">0 - 0</div>
      <div data-testid="match-id"></div>
      <div data-testid="seat"></div>
      <div data-testid="player-id"></div>
      <div data-testid="result"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
